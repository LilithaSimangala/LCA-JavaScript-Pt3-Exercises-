<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Profile Card</title>

    <style>

        #profileCard
        {
            border: 2px solid black;
            padding: 20px;
            width: 300px;
        }

        .active-status
        {
            background-color: lightgreen;
        }

    </style>

</head>

<body>

    <div id="profileCard">

        <img
        id="profileImage"
        src="https://placehold.co/100x100"
        alt="Profile Image">

        <h2 id="profileName">
            John Doe
        </h2>

        <p id="profileRole">
            Software Developer
        </p>

        <p id="profileBio">
            Passionate about coding and learning new technologies.
        </p>

        <button id="updateNameBtn">
            Update Name
        </button>

        <button id="updateRoleBtn">
            Update Role
        </button>

        <button id="toggleStatusBtn">
            Toggle Active Status
        </button>

        <button id="changeImageBtn">
            Change Image
        </button>

    </div>

    <script src="week8_ex02_dom_profile_card.js"></script>

</body>
</html>
