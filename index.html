<!DOCTYPE html>
<html>

<head>
    <title>TechConnect Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <h1 class="mb-3">TechConnect Developer Hub</h1>

    <!-- Counter -->
    <h5>
        Developers Found:
        <span id="devCount">0</span>
    </h5>

    <!-- Search -->
    <input
        type="text"
        id="searchInput"
        class="form-control mb-3"
        placeholder="Search by name, role or skill">

    <!-- Toggle View -->
    <button id="toggleViewBtn" class="btn btn-dark mb-3">
        Toggle View
    </button>

    <!-- Add Developer Form -->
    <div class="card p-3 mb-3">

        <h5>Add Developer</h5>

        <input id="nameInput" class="form-control mb-2" placeholder="Name">
        <input id="roleInput" class="form-control mb-2" placeholder="Role">
        <input id="skillsInput" class="form-control mb-2" placeholder="Skills (comma separated)">
        <input id="locationInput" class="form-control mb-2" placeholder="Location">

        <button id="addBtn" class="btn btn-success">
            Add Developer
        </button>

    </div>

    <!-- Output -->
    <div id="output" class="row"></div>

</div>

<script src="js/main.js"></script>

</body>
</html>
